name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create a GitHub Release and upload assets

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Fast gate: unit tests
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./qbt/...

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build shared library for every platform / arch
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ─────────────────────────────────────────────────────────
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            lib: libqbt.so
            archive: libqbt-linux-amd64.tar.gz

          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            apt: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            lib: libqbt.so
            archive: libqbt-linux-arm64.tar.gz

          # ── macOS (both arches from the same Apple-Silicon runner) ────────
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            lib: libqbt.dylib
            archive: libqbt-darwin-arm64.tar.gz

          - runner: macos-latest
            goos: darwin
            goarch: amd64
            cc: "clang -arch x86_64"
            lib: libqbt.dylib
            archive: libqbt-darwin-amd64.tar.gz

          # ── Windows ───────────────────────────────────────────────────────
          - runner: windows-latest
            goos: windows
            goarch: amd64
            lib: libqbt.dll
            archive: libqbt-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cross-compiler (Linux arm64)
        if: matrix.apt != ''
        run: sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: go build -buildmode=c-shared -o ${{ matrix.lib }} ./clib/

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.archive }} ${{ matrix.lib }} libqbt.h

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.lib }}", "libqbt.h" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and upload all archives
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Publish release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
